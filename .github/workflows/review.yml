name: review-pull-requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: reviewbot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-pull:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run AI reviewer
        if: env.GEMINI_API_KEY != ''
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ env.GEMINI_API_KEY }}
          ignore_patterns: '*.lock,package-lock.json,*.generated.*'
          max_diff_lines: 500
          max_comments: 20

      - name: Explain skipped review
        if: env.GEMINI_API_KEY == ''
        run: |
          echo "### ReviewBot skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The Gemini secret is unavailable. This is expected for pull requests from forks." >> "$GITHUB_STEP_SUMMARY"
