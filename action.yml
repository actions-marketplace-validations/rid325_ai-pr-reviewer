name: 'ReviewBot AI PR Reviewer'
description: 'Review pull requests and provide AI-generated suggestions'
author: 'rid325'

inputs:
  github_token:
    required: true
    description: 'GitHub token with pull-requests: write permission'
  gemini_api_key:
    required: true
    description: 'Google Gemini API key for AI review'
  ignore_patterns:
    required: false
    description: 'Comma-separated fnmatch patterns for files to skip (e.g. *.lock,*.generated.js,migrations/*)'
    default: '*.lock,package-lock.json,*.generated.*'
  max_diff_lines:
    required: false
    description: 'Maximum added/removed lines per Gemini API call; larger diffs are split into chunks'
    default: '500'
  max_comments:
    required: false
    description: 'Maximum number of validated review comments to post'
    default: '20'
  model:
    required: false
    description: 'Gemini model ID used for review'
    default: 'gemini-3.8-flash'
  dry_run:
    required: false
    description: 'Analyze and print findings without posting to the pull request'
    default: 'false'

outputs:
  issues_found:
    description: 'Number of validated findings'
  files_reviewed:
    description: 'Number of files sent for review'
  files_skipped:
    description: 'Number of files skipped by filters or limits'

runs:
  using: 'docker'
  image: 'Dockerfile'

branding:
  icon: 'eye'
  color: 'blue'
